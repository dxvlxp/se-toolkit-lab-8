[project]
name = "mcp-obs"
version = "0.1.0"
description = "Read-only VictoriaLogs and VictoriaTraces MCP tools"
requires-python = "==3.14.*"
dependencies = ["httpx==0.28.1", "mcp>=1.26.0,<2.0.0", "pydantic>=2.12.0,<3.0.0"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
